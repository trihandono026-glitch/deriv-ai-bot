<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DERIV AI BOT V19</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1220;color:#e8edf7;font:14px Arial,sans-serif;padding:16px}
main{max-width:850px;margin:auto}
h2{color:#65d6a5}
.card{background:#171f30;border:1px solid #29364c;border-radius:12px;padding:15px;margin:12px 0}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #39465e;background:#0d1524;color:white}
button{background:#167c58;border:0;font-weight:bold}
button.stop{background:#a63838}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.value{font-size:20px;font-weight:bold;color:#65d6a5}
small{color:#9baac0}
#logs{height:180px;overflow:auto;background:#080d16;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h2>DERIV AI BOT V19</h2>
<small>DEMO ONLY · Multi-timeframe · Auto reconnect · Risk protection</small>

<div class="card">
<label>Deriv App ID</label>
<input id="appId" placeholder="Masukkan App ID">
<label>Demo API Token</label>
<input id="token" type="password" placeholder="Masukkan token DEMO">
<button id="connect">HUBUNGKAN AKUN DEMO</button>
<button id="disconnect" class="stop">PUTUSKAN KONEKSI</button>
</div>

<div class="card grid">
<div>STATUS<div id="status" class="value">OFFLINE</div></div>
<div>SALDO<div id="balance" class="value">--</div></div>
<div>HARGA<div id="price" class="value">--</div></div>
<div>JAM WIB<div id="clock" class="value">--</div></div>
</div>

<div class="card">
<label>Instrumen</label>
<select id="symbol"><option value="1HZ100V">Volatility 100 (1s)</option></select>
<label>Timeframe analisis</label>
<select id="timeframe">
<option value="60">M1 - setiap 1 menit</option>
<option value="120">M2 - setiap 2 menit</option>
<option value="300">M5 - setiap 5 menit</option>
</select>
<label>Durasi kontrak</label>
<select id="duration">
<option value="1">1 menit</option><option value="2">2 menit</option>
<option value="5">5 menit</option>
</select>
<label>Nilai transaksi</label>
<input id="stake" type="number" value="1" min="0.35" step="0.01">
<label>Maksimal kontrak aktif</label>
<select id="maxOpen"><option>1</option><option selected>2</option><option>3</option><option>5</option></select>
<button id="start">MULAI AUTO TRADING DEMO</button>
<button id="stop" class="stop">STOP BOT</button>
</div>

<div class="card grid">
<div>SINYAL<div id="signal" class="value">WAIT</div></div>
<div>HITUNGAN TRADE<div id="trades" class="value">0</div></div>
<div>WIN<div id="wins" class="value">0</div></div>
<div>LOSS<div id="losses" class="value">0</div></div>
</div>

<div class="card">
<b>LOG AKTIVITAS</b>
<div id="logs"></div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const API="https://api.derivws.com/trading/v1";
const PUBLIC_WS="wss://api.derivws.com/trading/v1/options/ws/public";
let account=null,market=null,accountId=null,accountUrl=null;
let running=false,botOn=false,reconnectAccount=false,reconnectMarket=false;
let req=0,pending=new Map(),prices=[],lastCandle=0;
let active=new Map(),buyBusy=false,buyUncertain=false;
let wins=0,losses=0,trades=0,cycleBusy=false;
let reconnectTimers={account:null,market:null};

function log(s){
 const d=new Date().toLocaleTimeString("id-ID",{timeZone:"Asia/Jakarta"});
 $("logs").textContent=`${d} WIB | ${s}\n`+$("logs").textContent;
}
function status(s){$("status").textContent=s}
function rpc(ws,data,timeout=12000){
 return new Promise((resolve,reject)=>{
  if(!ws||ws.readyState!==1)return reject(Error("Koneksi belum siap"));
  const id=++req;data.req_id=id;
  const timer=setTimeout(()=>{pending.delete(id);reject(Error("Request timeout"));},timeout);
  pending.set(id,{resolve,reject,timer});
  ws.send(JSON.stringify(data));
 });
}
function bind(ws,type){
 ws.onmessage=e=>{
  let d;try{d=JSON.parse(e.data)}catch{return}
  if(d.req_id&&pending.has(d.req_id)){
   const p=pending.get(d.req_id);clearTimeout(p.timer);pending.delete(d.req_id);
   if(d.error)p.reject(Error(d.error.message));else p.resolve(d);
  }
  if(d.error)log(type+" API: "+d.error.message);
  if(type==="market"){
   if(d.tick){
    $("price").textContent=d.tick.quote;
    prices.push({t:d.tick.epoch,p:d.tick.quote});
    if(prices.length>200)prices.shift();
   }
  }
  if(type==="account"){
   if(d.balance){$("balance").textContent=d.balance.balance+" "+d.balance.currency;}
   if(d.proposal_open_contract)updateContract(d.proposal_open_contract);
  }
 };
 ws.onclose=()=>{
  if(type==="market"){market=null;log("Data pasar terputus.");if(running)scheduleReconnect("market");}
  else{account=null;log("Koneksi akun terputus.");if(running)scheduleReconnect("account");}
 };
 ws.onerror=()=>log("Gangguan koneksi "+type);
}
function scheduleReconnect(type){
 if(!running||reconnectTimers[type])return;
 reconnectTimers[type]=setTimeout(async()=>{
  reconnectTimers[type]=null;
  try{
   if(type==="market")await connectMarket();
   else await connectAccount();
  }catch(e){log("Reconnect "+type+" gagal: "+e.message);scheduleReconnect(type);}
 },3000);
}
async function connectMarket(){
 if(market&&market.readyState===1)return;
 market=new WebSocket(PUBLIC_WS);bind(market,"market");
 await new Promise((resolve,reject)=>{
  const t=setTimeout(()=>reject(Error("Market timeout")),12000);
  market.onopen=()=>{clearTimeout(t);resolve();};
  market.onerror=()=>{clearTimeout(t);reject(Error("Market gagal"));};
 });
 await rpc(market,{ticks:$("symbol").value,subscribe:1});
 await rpc(market,{ticks_history:$("symbol").value,style:"candles",
  granularity:Number($("timeframe").value),count:100,end:"latest"});
 log("Data pasar tersambung.");
}
async function connectAccount(){
 const token=$("token").value.trim(),appId=$("appId").value.trim();
 if(!token||!appId)throw Error("App ID dan token wajib diisi");
 const r=await fetch(API+"/accounts",{headers:{
  "Authorization":"Bearer "+token,"Deriv-App-ID":appId
 }});
 if(!r.ok)throw Error("Gagal mengambil akun. Periksa token dan App ID.");
 const j=await r.json(),accounts=j.data||j.accounts||[];
 const demo=accounts.find(a=>String(a.account_type||a.type||"").toLowerCase().includes("demo"));
 if(!demo)throw Error("Akun DEMO tidak ditemukan. Bot tidak mengizinkan akun REAL.");
 accountId=demo.account_id||demo.id;
 if(!accountId)throw Error("ID akun tidak ditemukan");
 const o=await fetch(`${API}/accounts/${accountId}/otp`,{method:"POST",headers:{
  "Authorization":"Bearer "+token,"Deriv-App-ID":appId
 }});
 if(!o.ok)throw Error("Gagal meminta OTP akun");
 const oj=await o.json();accountUrl=oj.data?.url;
 if(!accountUrl||!accountUrl.includes("/ws/demo"))throw Error("URL bukan koneksi DEMO");
 account=new WebSocket(accountUrl);bind(account,"account");
 await new Promise((resolve,reject)=>{
  const t=setTimeout(()=>reject(Error("Account WS timeout")),12000);
  account.onopen=()=>{clearTimeout(t);resolve();};
  account.onerror=()=>{clearTimeout(t);reject(Error("Account WS gagal"));};
 });
 await rpc(account,{balance:1,subscribe:1});
 await rpc(account,{portfolio:1});
 log("Akun DEMO tersambung.");
}
async function connect(){
 try{
  running=true;status("MENGHUBUNGKAN");
  await connectMarket();await connectAccount();
  status("TERHUBUNG");
 }catch(e){log(e.message);status("GAGAL");}
}
function disconnect(){
 running=false;botOn=false;status("OFFLINE");
 Object.values(reconnectTimers).forEach(clearTimeout);
 reconnectTimers={account:null,market:null};
 try{market?.close()}catch{}try{account?.close()}catch{}
 market=null;account=null;
 log("Koneksi diputus.");
}
function stopBot(){botOn=false;log("Bot dihentikan. Kontrak yang sudah dibeli tetap berjalan.");}
function ema(a,n){
 if(a.length<n)return null;
 let k=2/(n+1),v=a.slice(0,n).reduce((x,y)=>x+y,0)/n;
 for(let i=n;i<a.length;i++)v=a[i]*k+v*(1-k);
 return v;
}
function getSignal(){
 const a=prices.map(x=>x.p);
 if(a.length<55)return "WAIT";
 const e9=ema(a.slice(-50),9),e21=ema(a.slice(-50),21),e50=ema(a.slice(-50),50);
 const last=a[a.length-1],prev=a[a.length-2];
 if(e9>e21&&e21>e50&&last>prev)return "CALL";
 if(e9<e21&&e21<e50&&last<prev)return "PUT";
 return "WAIT";
}
async function reconcile(){
 if(!account||account.readyState!==1)return;
 const r=await rpc(account,{portfolio:1});
 const list=r.portfolio?.contracts||[];
 const ids=new Set(list.map(x=>String(x.contract_id)));
 for(const [id] of active)if(!ids.has(id))active.delete(id);
 for(const c of list){
  const id=String(c.contract_id);
  if(!active.has(id)){
   active.set(id,{id,stake:Number(c.buy_price)||0});
   rpc(account,{proposal_open_contract:1,contract_id:Number(id),subscribe:1}).catch(()=>{});
  }
 }
 buyUncertain=false;
}
function updateContract(c){
 const id=String(c.contract_id);
 if(c.is_sold||c.status==="sold"){
  active.delete(id);
  if(Number(c.profit)>0){wins++;log("KONTRAK WIN: +"+c.profit);}
  else{losses++;log("KONTRAK LOSS: "+c.profit);}
  $("wins").textContent=wins;$("losses").textContent=losses;
  $("trades").textContent=++trades;
 }
}
async function buy(type){
 if(!botOn||buyBusy||buyUncertain)return;
 if(!account||account.readyState!==1)throw Error("Akun belum tersambung");
 if(active.size>=Number($("maxOpen").value))return log("Batas kontrak aktif tercapai.");
 buyBusy=true;
 try{
  const symbol=$("symbol").value,dur=Number($("duration").value),stake=Number($("stake").value);
  const p=await rpc(account,{proposal:1,amount:stake,basis:"stake",
   contract_type:type,currency:"USD",duration:dur,duration_unit:"m",underlying_symbol:symbol});
  const proposal=p.proposal;
  if(!proposal?.id)throw Error("Proposal tidak tersedia untuk instrumen/durasi ini");
  let result;
  try{
   result=await rpc(account,{buy:proposal.id,price:stake},15000);
  }catch(e){
   buyUncertain=true;log("Status BUY belum pasti. Memeriksa portfolio agar tidak terjadi order ganda.");
   await reconcile();throw e;
  }
  const id=result.buy?.contract_id;
  if(!id)throw Error("ID kontrak tidak diterima");
  active.set(String(id),{id:String(id),stake});
  await rpc(account,{proposal_open_contract:1,contract_id:id,subscribe:1});
  log("ENTRY "+type+" berhasil. Kontrak "+id);
 }finally{buyBusy=false;}
}
async function cycle(){
 if(!botOn||cycleBusy)return;
 cycleBusy=true;
 try{
  if(!account||account.readyState!==1||!market||market.readyState!==1)return;
  if(buyUncertain){await reconcile();return;}
  const tf=Number($("timeframe").value);
  const candle=await rpc(market,{ticks_history:$("symbol").value,
   style:"candles",granularity:tf,count:60,end:"latest"});
  const cs=candle.candles||[];
  if(cs.length<55)return;
  const closed=cs[cs.length-2];
  const candleTime=Number(closed.epoch);
  if(!candleTime||candleTime===lastCandle)return;
  lastCandle=candleTime;
  const signal=getSignal();
  $("signal").textContent=signal;
  log("Analisis candle baru: "+signal);
  if(signal!=="WAIT")await buy(signal);
 }catch(e){log("Siklus: "+e.message);}
 finally{cycleBusy=false;}
}
$("connect").onclick=connect;
$("disconnect").onclick=disconnect;
$("start").onclick=()=>{
 if(!running||!account||!market){log("Hubungkan akun DEMO terlebih dahulu.");return;}
 botOn=true;log("AUTO TRADING DEMO DIMULAI.");
 cycle();
};
$("stop").onclick=stopBot;
$("symbol").onchange=async()=>{
 lastCandle=0;
 if(market&&market.readyState===1){
  try{await rpc(market,{ticks:$("symbol").value,subscribe:1});}catch(e){log(e.message);}
 }
};
$("timeframe").onchange=()=>{lastCandle=0;log("Timeframe diubah. Menunggu candle berikutnya.");};
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("id-ID",{timeZone:"Asia/Jakarta"});},1000);
setInterval(()=>{if(botOn)cycle();},3000);
setInterval(()=>{if(running&&account?.readyState===1)reconcile().catch(()=>{});},15000);
</script>
</body>
</html>
